<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favHawkPrimary" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="favHawkFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect width="120" height="120" rx="30" fill="url(#favBgGrad)" />
  <rect width="118" height="118" x="1" y="1" rx="29" stroke="#BAE6FD" stroke-width="2" />
  
  <!-- Back Wing Shadow -->
  <polygon points="28,78 52,42 66,54 44,88" fill="#0F172A" fill-opacity="0.15" />

  <!-- Hawk Wings & Beak -->
  <g filter="url(#favGlow)">
    <!-- Primary Wing Blade -->
    <polygon points="18,80 58,16 48,52 92,30 64,66 98,50 48,96 56,72" fill="url(#favHawkPrimary)" />
    
    <!-- Secondary Facet -->
    <polygon points="26,78 54,36 44,58 76,46 52,78" fill="url(#favHawkFacet)" />

    <!-- Head & Beak -->
    <polygon points="58,16 78,32 68,48 54,36" fill="#0284C7" />
    <polygon points="78,32 94,36 82,44 76,40" fill="#00B4D8" />

    <!-- Hawk Eye -->
    <circle cx="70" cy="34" r="4" fill="#FFFFFF" />
    <circle cx="70" cy="34" r="2" fill="#00B4D8" />
  </g>
</svg>